<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c4cfa1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TamaTask">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=10">
<script src="tema.js?v=10"></script>
<title>TamaTask</title>
</head>
<body>
<main>
  <header>
    <canvas id="pet" width="60" height="65" aria-hidden="true"></canvas>
    <h1>
      <span class="logo-txt">Tama<span>Task</span></span>
      <svg class="logo-svg" viewBox="0 0 244 74" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="14" y1="0" x2="224" y2="0">
            <stop offset="0" stop-color="#ff4fa3"/><stop offset=".2" stop-color="#ff8a3d"/>
            <stop offset=".4" stop-color="#ffd23f"/><stop offset=".6" stop-color="#4fd67d"/>
            <stop offset=".8" stop-color="#3fb7ff"/><stop offset="1" stop-color="#8a63ff"/>
          </linearGradient>
          <text id="lt" x="14" y="52" font-size="46" font-weight="900"
                font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif"><tspan>T</tspan><tspan dy="-3">a</tspan><tspan dy="4">m</tspan><tspan dy="-3">a</tspan><tspan dy="3">T</tspan><tspan dy="-3">a</tspan><tspan dy="3">s</tspan><tspan dy="-2">k</tspan></text>
        </defs>
        <g id="logo-g">
          <use href="#lt" x="4" y="5" class="l-sombra"/>
          <use href="#lt" class="l-out"/>
          <use href="#lt" class="l-ring"/>
          <use href="#lt" fill="url(#lg)"/>
        </g>
        <polygon class="l-star" transform="translate(232 17)" points="0,-11 3,-3 11,0 3,3 0,11 -3,3 -11,0 -3,-3"/>
      </svg>
    </h1>
  </header>
  <div class="barra">
    <nav id="tabs">
      <button data-tab="inicio" class="on">Início</button>
      <button data-tab="backlog">Backlog<span id="cnt"></span></button>
    </nav>
    <button id="tema" type="button" aria-label="Mudar o visual">Tema</button>
  </div>

  <section id="inicio">
    <label>O que você precisa fazer?
      <input id="titulo" maxlength="200" autocomplete="off" placeholder="ex: jogar o lixo fora">
    </label>
    <div class="grupo">
      <p class="dica">Complexidade da tarefa</p>
      <div class="seg" id="dif">
        <button data-d="0"><span class="ic-p">&#xE000;</span><span class="ic-e">🌱</span>Fácil</button>
        <button data-d="1" class="on"><span class="ic-p">&#xE001;</span><span class="ic-e">⚡</span>Moderada</button>
        <button data-d="2"><span class="ic-p">&#xE002;</span><span class="ic-e">🔥</span>Difícil</button>
      </div>
    </div>
    <button id="add" class="primary">Adicionar ao backlog</button>
    <p id="ok" class="msg"></p>

    <hr class="div">

    <canvas id="egg" width="160" height="160" aria-label="Ovo: toque para sortear"></canvas>
    <button id="sortear" class="primary">Sortear</button>
    <p id="aviso" class="msg"></p>
    <ul id="sorteadas"></ul>
  </section>

  <section id="backlog" hidden>
    <p id="vazio" class="msg">Backlog vazio. Adicione tarefas na aba Início.</p>
    <ul id="lista"></ul>
    <div id="blocoFeitas" hidden>
      <hr class="div">
      <h2 class="sub">Concluídas <span id="cntFeitas"></span></h2>
      <ul id="feitas"></ul>
      <button id="limpar">Limpar concluídas</button>
    </div>
    <hr class="div">
    <div class="row">
      <button id="exportar">Exportar backup</button>
      <label class="btn">Importar backup
        <input type="file" id="importar" accept="application/json,.json" hidden>
      </label>
    </div>
  </section>

  <footer>Desenvolvido por MaxOvc</footer>
</main>
<script src="pet.js?v=10"></script>
<script src="egg.js?v=10"></script>
<script src="festa.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
